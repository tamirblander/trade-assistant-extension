<!DOCTYPE html>
<html>
<head>
    <title>AI Chart Analysis</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f1419;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #374151;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-icon {
            width: 24px;
            height: 24px;
            background-color: #374151;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #6b7280;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Summary Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .summary-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        .summary-label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .summary-value {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
        }

        .summary-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Colors */
        .trend-bullish { color: #10b981; }
        .trend-bearish { color: #ef4444; }
        .trend-neutral { color: #6b7280; }
        .color-blue { color: #3b82f6; }
        .color-red { color: #ef4444; }
        .color-green { color: #10b981; }
        .color-purple { color: #8b5cf6; }
        .color-orange { color: #f59e0b; }
        .color-yellow { color: #eab308; }

        /* Confidence bar */
        .confidence-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background-color: #374151;
            width: 100%;
        }

        .confidence-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background-color: #3b82f6;
            transition: width 0.5s ease;
        }

        /* Timing Alert */
        .timing-alert {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timing-icon {
            width: 16px;
            height: 16px;
            color: #eab308;
            flex-shrink: 0;
        }

        .timing-text {
            font-size: 14px;
            font-weight: 500;
            color: #e5e7eb;
            flex: 1;
        }

        .timing-urgency {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #374151;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 16px;
        }

        @media (min-width: 1024px) {
            .main-grid {
                grid-template-columns: 2fr 1fr;
            }
            .screenshot-container {
                display: block !important;
            }
        }

        /* Section Cards */
        .section-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-icon {
            width: 16px;
            height: 16px;
            color: #9ca3af;
        }

        /* Patterns */
        .patterns-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .pattern-item {
            background-color: #374151;
            border: 1px solid #4b5563;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pattern-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pattern-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .pattern-label {
            font-size: 14px;
            font-weight: 500;
            color: #e5e7eb;
        }

        .pattern-strength {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
        }

        /* Insights */
        .insights-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .insight-item {
            background-color: #374151;
            border: 1px solid #4b5563;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .insight-icon {
            width: 14px;
            height: 14px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .insight-text {
            font-size: 14px;
            color: #e5e7eb;
            line-height: 1.5;
        }

        /* Recommendation */
        .recommendation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .recommendation-item {
            text-align: center;
        }

        .recommendation-label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .recommendation-value {
            font-size: 16px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .recommendation-conditions {
            background-color: #374151;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            color: #d1d5db;
            line-height: 1.5;
        }

        /* Forecast */
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .forecast-item {
            background-color: #374151;
            border-radius: 6px;
            padding: 12px;
        }

        .forecast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .forecast-type {
            font-size: 14px;
            font-weight: 600;
            color: #e5e7eb;
        }

        .forecast-probability {
            font-size: 14px;
            font-weight: 700;
            color: #10b981;
        }

        .forecast-description {
            font-size: 13px;
            color: #d1d5db;
            line-height: 1.5;
        }

        /* Screenshot */
        .screenshot-container {
            display: none;
        }

        .screenshot-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid #4b5563;
        }

        /* Error */
        .error {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            text-align: center;
            color: #ef4444;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 12px;
            }
            
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            
            .summary-card {
                padding: 12px;
            }
            
            .patterns-grid {
                grid-template-columns: 1fr;
            }
            
            .recommendation-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
            
            .recommendation-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app-content">
            <div style="display: flex; align-items: center; justify-content: center; min-height: 200px; color: #6b7280;">
                Loading analysis...
            </div>
        </div>
    </div>
    <script src="results.js"></script>
</body>
</html>
